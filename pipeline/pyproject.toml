[project]
name = "fri-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "apache-hamilton>=1.89,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "scipy>=1.14,<2",
  "google-cloud-storage>=2.18,<4",
  "pmtiles>=3.4,<4",
  "mapbox-vector-tile>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
