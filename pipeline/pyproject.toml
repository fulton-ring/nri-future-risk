[project]
name = "fri-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "apache-hamilton>=1.89,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "scipy>=1.14,<2",
  "google-cloud-storage>=2.18,<4",
  "pmtiles>=3.4,<4",
  "mapbox-vector-tile>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.optional-dependencies]
results = [
  "geopandas>=1,<2", "pyarrow>=17", "xarray>=2025.1", "zarr>=3,<4", "rashid==0.1.8", "pillow>=11,<13",
]
preparation = [
  "aiohttp>=3.9,<4", "fsspec>=2024.6", "geopandas>=1,<2", "h5py>=3.11,<4",
  "pyarrow>=17", "rasterio>=1.4,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
