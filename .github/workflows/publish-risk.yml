name: Stage approved Future Risk Index results
on:
  push:
    branches: [main]
    paths: ["releases/candidates/**/candidate.json", "releases/reviews/**/result-manifest.json", "releases/reviews/**/public-review.json"]
permissions:
  contents: read
  id-token: write
concurrency:
  group: risk-publication
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RESULTS_BUCKET: ${{ vars.FRI_RESULTS_BUCKET }}
      STAGING_BUCKET: ${{ vars.FRI_PUBLISHER_STAGING_BUCKET }}
      BEFORE_SHA: ${{ github.event.before }}
      APPROVED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify the exact approved result
        run: |
          python - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          paths = subprocess.check_output([
              "git", "diff", "--name-only", os.environ["BEFORE_SHA"], os.environ["APPROVED_SHA"],
              "--", "releases/candidates/*/candidate.json",
              "releases/reviews/*/result-manifest.json", "releases/reviews/*/public-review.json"
          ], text=True).splitlines()
          reviews = {str(Path(path).parent) for path in paths if path.startswith("releases/reviews/")}
          candidates = [path for path in paths if path.startswith("releases/candidates/")]
          if reviews:
              if len(reviews) != 1 or candidates:
                  raise SystemExit("Merge exactly one review or legacy candidate per PR")
              review = reviews.pop()
              if not re.fullmatch(r"releases/reviews/[a-z][a-z0-9-]{2,62}", review):
                  raise SystemExit("Invalid review path")
              with open(os.environ["GITHUB_ENV"], "a") as handle:
                  handle.write(f"REVIEW_PATH={os.environ['GITHUB_WORKSPACE']}/{review}\nPUBLICATION_KIND=v120-review\n")
              raise SystemExit(0)
          if len(paths) != 1:
              raise SystemExit("Merge exactly one candidate per PR")
          path = Path(paths[0])
          if not re.fullmatch(r"releases/candidates/[a-z][a-z0-9-]{2,62}/candidate.json", str(path)):
              raise SystemExit("Invalid candidate path")
          candidate = json.loads(path.read_text())
          pointer = json.loads((path.parent / "results.json").read_text())
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          if not candidate["publishable"] or not pointer["publishable"]:
              raise SystemExit("Exploratory analyses require a separate scientific publication review")
          if pointer["collection"] != "future-risk-index" or pointer["sourceRunSha256"] != digest:
              raise SystemExit("Portolan result does not match the approved candidate")
          if pointer["resultsUri"] != f"gs://{os.environ['RESULTS_BUCKET']}":
              raise SystemExit("Results bucket differs from deployment configuration")
          if not re.fullmatch(r"v[0-9A-Za-z-]{1,62}", pointer["version"]):
              raise SystemExit("Invalid results version")
          if not re.fullmatch(r"[a-f0-9]{64}", pointer["manifestSha256"]):
              raise SystemExit("Invalid results manifest digest")
          with open(os.environ["GITHUB_ENV"], "a") as handle:
              handle.write(f"REVIEW_PATH={os.environ['GITHUB_WORKSPACE']}/{path.parent}\nPUBLICATION_KIND=legacy-candidate\n")
              handle.write(f"RESULTS_VERSION={pointer['version']}\n")
              handle.write(f"RESULTS_MANIFEST_SHA={pointer['manifestSha256']}\n")
          PY
          test -n "$RESULTS_BUCKET" && test -n "$STAGING_BUCKET"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.4"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FRI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FRI_PUBLISHER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Copy approved collection data to existing staging
        run: |
          if test "$PUBLICATION_KIND" = v120-review; then
            uv run --directory pipeline --frozen --extra results python -m fri_pipeline.current_stage \
              --results-uri "gs://$RESULTS_BUCKET" --staging-uri "gs://$STAGING_BUCKET" \
              --approved-source-manifest "$REVIEW_PATH/result-manifest.json" \
              --approved-public-review "$REVIEW_PATH/public-review.json" \
              --approved-revision "$APPROVED_SHA" > /tmp/promotion.json
          else
            uv run --directory pipeline --frozen --extra results python -m fri_pipeline.results_cloud stage \
              --results-uri "gs://$RESULTS_BUCKET" --version "$RESULTS_VERSION" \
              --manifest-sha256 "$RESULTS_MANIFEST_SHA" \
              --approved-candidate "$REVIEW_PATH/candidate.json" \
              --staging-uri "gs://$STAGING_BUCKET" > /tmp/promotion.json
          fi
          cat /tmp/promotion.json >> "$GITHUB_STEP_SUMMARY"
          echo "Staged the future-risk-index collection. Downstream publication owns transforms, hosted assets and catalog activation." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: future-risk-index-staging-${{ github.run_id }}
          path: /tmp/promotion.json
