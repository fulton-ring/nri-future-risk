name: Prepare Future Risk Index results
on:
  workflow_dispatch:
    inputs:
      snapshot_uri:
        description: Verified climate snapshot (leave blank to use the pinned MME50 snapshot)
        required: false
        type: string
      snapshot_sha256:
        description: SHA-256 required when providing a snapshot
        required: false
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: risk-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 400
    env:
      PROJECT: ${{ vars.FRI_GCP_PROJECT }}
      REGION: ${{ vars.FRI_GCP_REGION }}
      NETWORK: ${{ vars.FRI_NETWORK }}
      SUBNETWORK: ${{ vars.FRI_SUBNETWORK }}
      REGISTRY: ${{ vars.FRI_IMAGE_REPOSITORY }}
      WORKER_SA: ${{ vars.FRI_BATCH_SERVICE_ACCOUNT }}
      EXPERIMENTS_BUCKET: ${{ vars.FRI_EXPERIMENTS_BUCKET }}
      RESULTS_BUCKET: ${{ vars.FRI_RESULTS_BUCKET }}
      SNAPSHOT_URI: ${{ inputs.snapshot_uri }}
      SNAPSHOT_SHA: ${{ inputs.snapshot_sha256 }}
      RELEASE_ID: fri-v120-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        env:
          PR_TOKEN: ${{ secrets.FRI_PR_TOKEN }}
        run: |
          for name in PROJECT REGION NETWORK SUBNETWORK REGISTRY WORKER_SA EXPERIMENTS_BUCKET RESULTS_BUCKET PR_TOKEN; do
            test -n "${!name}" || { echo "Missing configuration: $name"; exit 1; }
          done
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.4"
      - run: uv run --directory pipeline --frozen --extra results --extra preparation pytest -q
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FRI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FRI_RUNNER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build exact worker
        run: |
          gcloud auth configure-docker "${REGISTRY%%/*}" --quiet
          docker buildx build --platform linux/amd64 --file pipeline/Preparation.Dockerfile \
            --tag "$REGISTRY:$GITHUB_SHA" --push --metadata-file /tmp/image.json .
          DIGEST=$(jq -r '."containerimage.digest"' /tmp/image.json)
          echo "WORKER_IMAGE=$REGISTRY@$DIGEST" >> "$GITHUB_ENV"
      - name: Assign results version
        run: echo "RESULTS_VERSION=$(date -u +v%Y%m%dT%H%M%SZ)" >> "$GITHUB_ENV"
      - name: Submit county and tract calculation to Cloud Batch
        run: |
          SNAPSHOT_ARGS=()
          if test -n "$SNAPSHOT_URI"; then
            SNAPSHOT_ARGS=(--snapshot "$SNAPSHOT_URI" --snapshot-sha256 "$SNAPSHOT_SHA")
          elif test -n "$SNAPSHOT_SHA"; then
            echo "Snapshot URI and hash must be supplied together"; exit 1
          fi
          uv run --directory pipeline --frozen --extra preparation --extra results \
            python -m fri_pipeline.current_cloud \
            --project "$PROJECT" --region "$REGION" --image "$WORKER_IMAGE" \
            --network "$NETWORK" --subnetwork "$SUBNETWORK" \
            --service-account "$WORKER_SA" --run-id "$RELEASE_ID" \
            --version "$RESULTS_VERSION" --code-revision "$GITHUB_SHA" \
            --output "gs://$EXPERIMENTS_BUCKET/runs/$RELEASE_ID" \
            --results-uri "gs://$RESULTS_BUCKET" "${SNAPSHOT_ARGS[@]}" --submit
          for attempt in $(seq 1 720); do
            STATE=$(gcloud batch jobs describe "$RELEASE_ID" --project "$PROJECT" \
              --location "$REGION" --format='value(status.state)')
            case "$STATE" in
              SUCCEEDED) exit 0 ;;
              FAILED|DELETION_IN_PROGRESS) echo "Batch ended: $STATE"; exit 1 ;;
            esac
            sleep 30
          done
          echo "Batch monitoring timed out; inspect the job before retrying."; exit 1
      - name: Prepare review report
        run: |
          TARGET="releases/reviews/$RELEASE_ID"
          mkdir -p "$TARGET"
          gcloud storage cp "gs://$EXPERIMENTS_BUCKET/runs/$RELEASE_ID/result-manifest.json" "$TARGET/"
          gcloud storage cp "gs://$EXPERIMENTS_BUCKET/runs/$RELEASE_ID/report.md" "$TARGET/"
          gcloud storage cp "gs://$RESULTS_BUCKET/_releases/$RESULTS_VERSION.json" "$TARGET/public-review.json"
          uv run --directory pipeline --frozen --extra results python - <<'PYVERIFY'
          import os
          from pathlib import Path
          from fri_pipeline.current_stage import validate_approval
          root = Path(os.environ["GITHUB_WORKSPACE"]) / "releases/reviews" / os.environ["RELEASE_ID"]
          receipt = validate_approval(root / "result-manifest.json", root / "public-review.json",
                                      f"gs://{os.environ['RESULTS_BUCKET']}")
          expected = f"gs://{os.environ['EXPERIMENTS_BUCKET']}/runs/{os.environ['RELEASE_ID']}/result-manifest.json"
          if receipt["sourceManifestUri"] != expected or receipt["version"] != os.environ["RESULTS_VERSION"]:
              raise SystemExit("Public receipt does not belong to this exact calculation")
          PYVERIFY
          cat "$TARGET/report.md" >> "$GITHUB_STEP_SUMMARY"
          cp "$TARGET/report.md" /tmp/pr-body.md
          echo "Public review catalog: https://storage.googleapis.com/$RESULTS_BUCKET/future-risk-index/catalog.json ($RESULTS_VERSION)" >> /tmp/pr-body.md
          echo "Immutable source artifacts: gs://$EXPERIMENTS_BUCKET/runs/$RELEASE_ID" >> /tmp/pr-body.md
          echo "Merging this PR approves the exact numeric data and source assets pinned by result-manifest.json and public-review.json for staging in the existing future-risk-index collection. Downstream publication owns transforms, hosting and activation." >> /tmp/pr-body.md
      - uses: actions/upload-artifact@v4
        with:
          name: risk-review-${{ env.RELEASE_ID }}
          path: releases/reviews/
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.FRI_PR_TOKEN }}
          branch: data/${{ env.RELEASE_ID }}
          base: main
          add-paths: releases/reviews/
          title: "Review NRI v1.20 county and tract results: ${{ env.RELEASE_ID }}"
          commit-message: "data: propose NRI v1.20 results ${{ env.RELEASE_ID }}"
          body-path: /tmp/pr-body.md
